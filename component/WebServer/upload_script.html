<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>ESP32 LED Control</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f6fa;
        margin: 0;
        padding: 0;
        color: #333;
    }
    header {
        background: #007bff;
        color: #fff;
        padding: 15px;
        text-align: center;
        font-size: 20px;
        font-weight: bold;
    }
    main {
        max-width: 500px;
        margin: 20px auto;
        background: #fff;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 {
        font-size: 18px;
        margin-bottom: 10px;
        border-left: 4px solid #007bff;
        padding-left: 8px;
        color: #007bff;
    }
    label {
        display: block;
        margin-top: 10px;
        font-weight: bold;
    }
    input[type="number"], select {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
    }
    input[type="range"] {
        width: 100%;
    }
    button {
        margin-top: 15px;
        padding: 10px;
        background: #28a745;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 15px;
        cursor: pointer;
        width: 100%;
    }
    button:hover {
        background: #218838;
    }
    .hidden {
        display: none;
    }
    #status {
        margin-top: 15px;
        font-size: 14px;
        color: #555;
        text-align: center;
    }
</style>
</head>
<body>

<header>Meka LED Control</header>
<main>
    <h2>Độ sáng (PWM)</h2>
    <label for="pwm">Độ sáng: <span id="pwmLabel">50%</span></label>
    <input type="range" id="pwm" min="0" max="100" value="50"
        oninput="updatePWMLabel(this.value); sendPWM(this.value);">

    <h2>Chế độ hoạt động</h2>
    <label for="modeSelect">Chọn chế độ:</label>
    <select id="modeSelect" onchange="updateModeUI()">
        <option value="normal">Bình thường</option>
        <option value="effect">Hiệu ứng</option>
    </select>

    <div id="normalMode">
        <label for="stepNormal">Số bậc LED (0-32):</label>
        <input type="number" id="stepNormal" min="0" max="32" value="5">
        <button onclick="sendStepNormal()">Gửi số bậc</button>
    </div>

    <div id="effectMode" class="hidden">
        <label for="stepEffect">Số bậc LED (0-32):</label>
        <input type="number" id="stepEffect" min="0" max="32" value="5">

        <label for="delayEffect">Độ trễ mỗi bậc (ms):</label>
        <input type="number" id="delayEffect" min="0" max="5000" value="500">

        <button onclick="sendEffect()">Gửi hiệu ứng</button>
    </div>

    <div id="status">Sẵn sàng</div>
</main>

<script>
const ESP32_IP = window.location.hostname;

function sendCommand(cmd) {
    fetch(`http://${ESP32_IP}/cmd?data=${encodeURIComponent(cmd)}`)
    .then(res => res.text())
    .then(data => {
        document.getElementById("status").innerText = "Đã gửi: " + cmd;
    })
    .catch(err => {
        document.getElementById("status").innerText = "Lỗi: " + err;
    });
}

function updatePWMLabel(val) {
    document.getElementById("pwmLabel").innerText = val + "%";
}
function sendPWM(val) {
    sendCommand(`PWM:${val}`); // vào test mode gửi 8 frame rồi về normal
}

function sendStepNormal() {
    let val = document.getElementById("stepNormal").value;
    sendCommand(`STEP:${val}`);
}

function sendEffect() {
    let steps = document.getElementById("stepEffect").value;
    let delay = document.getElementById("delayEffect").value;
    sendCommand(`EFFECT:${steps},${delay}`);
}

function updateModeUI() {
    let mode = document.getElementById("modeSelect").value;
    document.getElementById("normalMode").classList.toggle("hidden", mode !== "normal");
    document.getElementById("effectMode").classList.toggle("hidden", mode !== "effect");
}
</script>

</body>
</html>
